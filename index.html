<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survive It</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="crosshair"></div>

    <div id="menu">
      <h1>Survive It</h1>
      <p class="byline">A game by Henry Bailey</p>
      <p class="story">
        You are one of Gru's minions. Find the ancient temple hidden in the haunted woods.
      </p>
      <button id="play">Click to play</button>
      <ul class="controls">
        <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</li>
        <li><kbd>Mouse</kbd> look around</li>
        <li><kbd>Shift</kbd> run</li>
        <li><kbd>Space</kbd> jump</li>
        <li><kbd>F</kbd> torch on/off</li>
        <li><kbd>Esc</kbd> pause</li>
      </ul>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
